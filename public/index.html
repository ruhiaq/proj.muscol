<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musecoll</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musecoll">
<style>
:root{--bg:#0e0e11;--bg2:#15151a;--card:#1b1b22;--line:#2a2a33;--fg:#f4f4f6;--mut:#9a9aa8;--acc:#8b5cf6;--acc2:#ec4899;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:190px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
.hide{display:none!important}
.mut{color:var(--mut)}
.sm{font-size:13px}
h2{font-size:20px;margin:0 0 10px}
.top{position:static;display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand out" "search search" "nav nav";align-items:center;gap:10px;padding:10px 14px;background:rgba(14,14,17,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:15}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.3px}
.brand .logo{width:28px;height:28px;stroke:none}
.brand span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{grid-area:nav;display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:8px 2px;font-size:13px;font-weight:600;color:var(--mut);border-radius:9px;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--fg)}
.search{grid-area:search;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:20px;color:var(--mut)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)}
#logout{grid-area:out}
main{max-width:1300px;margin:0 auto;padding:16px 14px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:22px;border-radius:18px;margin-bottom:14px;background:linear-gradient(135deg,rgba(139,92,246,.38),rgba(236,72,153,.2) 55%,rgba(27,27,34,.4))}
.hero h2{font-size:28px;margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button.pri,label.pri{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));cursor:pointer}
button.ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
button.ghost:hover{background:#24242d}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.bar h2{margin:0}
.chips{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sp{flex:1}
select{padding:8px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--fg)}
.in,.edbox input,#login input{width:100%;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);outline:0;color:var(--fg)}
.in:focus,.edbox input:focus,#login input:focus{border-color:var(--acc)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04)}
.tl li:hover{background:var(--card)}
.tl li.on{background:rgba(139,92,246,.15)}
.tl li.on .ti{color:var(--acc)}
.num{width:24px;text-align:center;color:var(--mut);font-size:14px;flex:none;display:flex;justify-content:center}
.num svg{width:16px;height:16px;color:var(--acc)}
.th{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--card);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.th.clk{cursor:pointer;outline:2px solid transparent}
.th.clk:hover{outline-color:var(--acc)}
.tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{color:var(--mut)}
.ti{font-weight:600}
.dur{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.dl{display:inline-flex;color:var(--acc)}
.dl svg{width:14px;height:14px}
.ra{display:flex;gap:0;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;color:var(--mut);flex:none}
.ib:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.ib.act{color:var(--acc)}
.ib.hot{color:#f43f5e}
li.ed{cursor:default;align-items:flex-start}
li.ed:hover{background:none}
.edbox{flex:1;min-width:0;display:grid;grid-template-columns:1fr;gap:8px}
.up{border:2px dashed var(--line);border-radius:18px;padding:30px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--bg2)}
.up.over{border-color:var(--acc);background:rgba(139,92,246,.08)}
.up .big svg{width:42px;height:42px;color:var(--acc)}
.opt{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px}
.st{width:100%;text-align:left}
.st div{font-size:14px;margin-top:6px;word-break:break-all}
#login{max-width:380px;margin:10vh auto 0;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px}
#login h2{text-align:center;margin:0 0 4px}
.err{color:#f87171;font-size:14px;min-height:20px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:18;background:rgba(21,21,26,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.pin{max-width:1300px;margin:0 auto;padding:8px 14px;display:grid;grid-template-columns:1fr;grid-template-areas:"pr" "pt" "pc";gap:6px;align-items:center}
.pr{grid-area:pr;display:flex;align-items:center;gap:10px;min-width:0}
.pt{grid-area:pt;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut)}
.pt span{width:36px;text-align:center;flex:none}
.pc{grid-area:pc;display:flex;align-items:center;justify-content:center;gap:12px}
.play{width:46px;height:46px;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center}
.play svg{width:22px;height:22px}
.cov{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.pn{flex:1;min-width:0}
#now{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vol,#mute{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:0;border:0;padding:0;background:linear-gradient(to right,var(--acc) var(--p,0%),#3a3a46 var(--p,0%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
#seek{flex:1;min-width:0}
#msg{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:40;max-width:90vw;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#msg:empty{display:none}
#qPanel{position:fixed;right:12px;z-index:25;width:min(380px,calc(100vw - 24px));max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.6);padding:8px}
#qPanel .h{padding:8px 10px;font-weight:700}
#qPanel .qi{padding:10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qPanel .qi:hover{background:var(--bg2)}
#qPanel .qi.on{background:rgba(139,92,246,.18);font-weight:700}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:280px;max-width:92vw;max-height:80vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.mi{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;margin:4px 0;background:var(--bg2)}
.mi:hover{background:#262630}
@media (min-width:600px){.edbox{grid-template-columns:1fr 1fr}}
@media (min-width:900px){
  body{padding-bottom:110px}
  .top{position:sticky;top:0;grid-template-columns:auto 1fr auto auto;grid-template-areas:"brand nav search out";gap:12px 28px;padding:12px 28px}
  .tabs{background:none;padding:0;gap:6px}
  .tabs button{flex:none;padding:10px 14px;font-size:15px;border-radius:8px}
  .tabs button:hover{color:var(--fg)}
  .tabs button.on{background:none;color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
  .search{width:min(360px,30vw)}
  main{padding:24px 28px}
  .pin{padding:10px 28px;grid-template-columns:auto minmax(220px,1fr) minmax(280px,auto);grid-template-areas:"pc pt pr";gap:28px}
  .pc{gap:6px}
  #vol,#mute{display:flex}
  #vol{display:block;width:90px}
  .pn{max-width:240px}
}
@media (min-width:1100px){
  #list,#editList,#plTracks,#plList{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-content:start}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs></svg>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="url(#lg)"><rect x="2" y="9" width="3" height="6" rx="1.5"/><rect x="7" y="5" width="3" height="14" rx="1.5"/><rect x="12" y="2" width="3" height="20" rx="1.5"/><rect x="17" y="7" width="3" height="10" rx="1.5"/></svg>
    <span>Musecoll</span>
  </div>
  <nav id="nav" class="tabs hide">
    <button id="nv-lib" data-t="lib" class="on">듣기</button>
    <button id="nv-edit" data-t="edit">곡 편집</button>
    <button id="nv-add" data-t="add">곡 추가</button>
    <button id="nv-pl" data-t="pl">플레이리스트</button>
  </nav>
  <label id="searchBox" class="search hide"><span data-ic="search"></span><input id="q" type="search" placeholder="곡 검색 (제목, 아티스트)"></label>
  <button class="ib hide" id="logout" data-ic="logout" title="로그아웃"></button>
</header>

<main>
  <section id="login" class="hide">
    <h2>로그인</h2>
    <input id="em" type="email" placeholder="이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="pri" id="lbtn" style="justify-content:center">로그인</button>
  </section>

  <section id="app" class="hide">
    <div id="tab-lib">
      <div class="hero">
        <div><div class="mut sm">라이브러리</div><h2 id="libTitle">전체 곡</h2><div class="mut" id="libSub"></div></div>
        <div class="acts">
          <button class="pri" id="playAll"><span data-ic="play"></span>재생</button>
          <button class="ghost" id="shufAll"><span data-ic="shuffle"></span>셔플 재생</button>
        </div>
      </div>
      <div class="chips">
        <button class="chip on" id="sc-all">전체 곡</button>
        <button class="chip" id="sc-fav">♥ 즐겨찾기</button>
        <span class="sp"></span>
        <select id="sort">
          <option value="new">최신순</option><option value="old">오래된순</option>
          <option value="title">이름순</option><option value="artist">아티스트순</option>
        </select>
      </div>
      <ul id="list" class="tl"></ul>
      <p class="mut" id="empty"></p>
    </div>

    <div id="tab-edit" class="hide">
      <h2>곡 정보 수정</h2>
      <p class="mut">자켓 사진을 누르면 이미지를 바꿀 수 있어요. 제목·아티스트는 입력하고 칸 밖을 누르면 저장돼요.</p>
      <div class="bar"><input id="q2" class="in" type="search" placeholder="수정할 곡 검색"></div>
      <ul id="editList" class="tl"></ul>
    </div>

    <div id="tab-add" class="hide">
      <h2>곡 추가</h2>
      <p class="mut" id="usage"></p>
      <div class="up" id="drop">
        <div class="big" data-ic="upload"></div>
        <div>mp3, wav 파일을 여기로 끌어다 놓거나 선택하세요 (여러 개 가능)</div>
        <label class="pri">파일 선택<input id="file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" multiple hidden></label>
        <div class="opt mut">
          <label><input type="checkbox" id="conv" checked> wav는 mp3로 변환해서 올리기 (용량 절약)</label>
          <select id="kbps"><option value="192" selected>192kbps</option><option value="256">256kbps</option><option value="320">320kbps</option></select>
        </div>
        <div class="st" id="st"></div>
      </div>
    </div>

    <div id="tab-pl" class="hide">
      <div id="plListView">
        <div class="bar"><h2>플레이리스트</h2><button class="pri" id="plNew"><span data-ic="plus"></span>새 목록</button></div>
        <ul id="plList" class="tl"></ul>
        <p class="mut" id="plEmpty0"></p>
      </div>
      <div id="plDetail" class="hide">
        <div class="hero">
          <div><button class="ghost sm" id="plBack">← 목록</button><h2 id="plName"></h2></div>
          <div class="acts">
            <button class="pri" id="plPlay"><span data-ic="play"></span>재생</button>
            <button class="ghost" id="plSave">기기에 저장</button>
            <button class="ghost" id="plRen">이름</button>
            <button class="ghost" id="plDel">삭제</button>
          </div>
        </div>
        <ul id="plTracks" class="tl"></ul>
        <p class="mut" id="plEmpty"></p>
      </div>
    </div>
  </section>
</main>

<div id="player" class="hide">
  <div class="pin">
    <div class="pc">
      <button class="ib" id="shuf" data-ic="shuffle" title="셔플"></button>
      <button class="ib" id="prev" data-ic="prev" title="이전"></button>
      <button class="play" id="pp" title="재생/일시정지"></button>
      <button class="ib" id="next" data-ic="next" title="다음"></button>
      <button class="ib" id="rep" data-ic="repeat" title="반복"></button>
    </div>
    <div class="pt"><span id="tcur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="tdur">0:00</span></div>
    <div class="pr">
      <button class="ib" id="mute" title="음소거"></button><input id="vol" type="range" min="0" max="100" value="100">
      <img id="pcov" class="cov hide" alt="">
      <div class="pn"><div id="now">재생 중인 곡이 없어요</div></div>
      <button class="ib" id="favBtn" title="즐겨찾기"></button>
      <button class="ib" id="qBtn" data-ic="queue" title="재생 대기열"></button>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>
</div>

<p id="msg"></p>
<div id="qPanel" class="hide"></div>
<dialog id="dlg"><div id="dlgBody"></div><button class="mi" id="dlgX">닫기</button></dialog>
<input id="coverIn" type="file" accept="image/*" class="hide">

<script>
const $ = (s) => document.querySelector(s);
const I = (p, f) => '<svg viewBox="0 0 24 24"' + (f ? ' class="f"' : "") + ">" + p + "</svg>";
const RP = '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>';
const HP = '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>';
const VP = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>';
const ICONS = {
  play: I('<path d="M8 5v14l11-7z"/>', 1), pause: I('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>', 1),
  prev: I('<path d="M6 5h2v14H6zM19 5v14L8 12z"/>', 1), next: I('<path d="M16 5h2v14h-2zM5 5v14l11-7z"/>', 1),
  shuffle: I('<polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/>'),
  repeat: I(RP), repeat1: I(RP + '<path d="M11 10l1.5-1v6"/>'),
  heart: I(HP), heartF: I(HP, 1),
  queue: I('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
  vol: I(VP + '<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>'),
  mute: I(VP + '<line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'),
  more: I('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>', 1),
  search: I('<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'),
  logout: I('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'),
  plus: I('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  up: I('<polyline points="18 15 12 9 6 15"/>'), down: I('<polyline points="6 9 12 15 18 9"/>'),
  trash: I('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
  music: I('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'),
  dl: I('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
  upload: I('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
};
const setIc = (el, name) => (el.innerHTML = ICONS[name]);
document.querySelectorAll("[data-ic]").forEach((e) => setIc(e, e.dataset.ic));
setIc($("#pp"), "play"); setIc($("#favBtn"), "heart"); setIc($("#mute"), "vol");
const audio = $("#audio");
let CFG, S = null, tracks = [], curId = null, shuffle = false, rep = 0, queue = [], qpos = -1, plists = [], plId = null, plItems = [], coverTarget = null, allPl = [], saved = new Set(), curBlob = null, favView = false, pendingSeek = 0, lastSave = 0;
const LIMIT_GB = 9.5;

/* ---------- 로그인 / 토큰 ---------- */
async function auth(body, grant) {
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`, {
    method: "POST",
    headers: { apikey: CFG.key, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "로그인 실패");
  S = { access: d.access_token, refresh: d.refresh_token, exp: d.expires_at };
  localStorage.setItem("sess", JSON.stringify(S));
}
async function token() {

    catch (e) { if (e instanceof TypeError) return S.access; logout(); throw new Error("다시 로그인해 주세요"); }

}

/* ---------- 재생 ---------- */
const cache = {};
async function urlFor(key) {
  const c = cache[key];
  if (c && c.exp > Date.now()) return c.url;
  const r = await api("/api/play-url?key=" + encodeURIComponent(key));
  if (!r.ok) throw new Error("재생 주소를 받지 못했어요");
  const d = await r.json();
  cache[key] = { url: d.url, exp: Date.now() + (d.expiresIn - 300) * 1000 };
  return d.url;
}
const byId = (id) => tracks.findIndex((t) => t.id === id);
function buildQueue(startId) {
  let ids = view().map((t) => t.id);
  if (!ids.includes(startId)) ids = tracks.map((t) => t.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    const k = ids.indexOf(startId);
    if (k > 0) { ids.splice(k, 1); ids.unshift(startId); }
  }
  queue = ids;
  qpos = Math.max(0, ids.indexOf(startId));
}
let pre = null; // 미리 준비해 둔 다음 곡 {id, url, blob}
async function resolveSrc(t) {
  if (pre && pre.id === t.id) { const p = pre; pre = null; return p; }
  if (saved.has(t.file_key)) {
    const blob = await store("readonly", (x) => x.get(t.file_key));
    if (blob) return { id: t.id, url: URL.createObjectURL(blob), blob: true };
  }
  if (!navigator.onLine) throw new Error("오프라인이라 저장된(⬇) 곡만 재생할 수 있어요");
  return { id: t.id, url: await urlFor(t.file_key), blob: false };
}
async function prefetch() {
  if (!queue.length) return;
  let p = qpos + 1;
  if (p >= queue.length) { if (rep !== 1) return; p = 0; }
  const t = tracks[byId(queue[p])];
  if (!t || (pre && pre.id === t.id)) return;
  try {
    const r = await resolveSrc(t);
    if (pre && pre.blob) URL.revokeObjectURL(pre.url);
    pre = r;
  } catch {}
}
function announce(t) {
  $("#tdur").textContent = tfmt(t.duration_sec);
  $("#tcur").textContent = "0:00";
  $("#seek").value = 0;
  fill($("#seek"));
  if (!("mediaSession" in navigator)) return;
  const cu = coverUrl(t);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: t.artist || "",
    artwork: cu ? [{ src: cu, sizes: "600x600", type: "image/jpeg" }] : [],
  });
  navigator.mediaSession.playbackState = "playing";
}
let playSeq = 0; // 가장 최근 재생 요청 번호 (겹친 요청의 오래된 오류를 무시하기 위함)
function syncPos() {
  try {
    if ("mediaSession" in navigator && isFinite(audio.duration))
      navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: audio.playbackRate });
  } catch {}
}
async function play(i, keep) {
  const t = tracks[i];
  if (!t) return;
  curId = t.id;
  if (!keep) buildQueue(t.id);
  pendingSeek = 0;
  saveQueue();
  const my = ++playSeq;
  announce(t); // 화면이 꺼져 있어도 반영되도록 가장 먼저 갱신
  try {
    const r = await resolveSrc(t);
    if (my !== playSeq) { if (r.blob) URL.revokeObjectURL(r.url); return; } // 더 새로운 요청이 있음
    const prev = curBlob;
    curBlob = r.blob ? r.url : null;
    audio.src = r.url;
    if (prev) URL.revokeObjectURL(prev);
    await audio.play();
  } catch (e) {
    if (my !== playSeq || e.name === "AbortError") return; // 다른 곡 요청에 밀려난 것일 뿐 진짜 실패가 아님
    $("#now").textContent = "재생 실패: " + e.message;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    return;
  }
  if (my !== playSeq) return;
  $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  render();
  const cu = coverUrl(t), pc = $("#pcov");
  pc.classList.toggle("hide", !cu);
  if (cu) pc.src = cu;
  if (qOpen()) renderQueue();
  prefetch();
}
function step(d, auto) {
  if (!queue.length) return;
  if (!auto && d < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
  let p = qpos + d;
  if (p >= queue.length) { if (auto && rep !== 1) { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; return; } p = 0; }
  if (p < 0) p = queue.length - 1;
  qpos = p;
  play(byId(queue[p]), true);
}
$("#prev").onclick = () => step(-1);
$("#next").onclick = () => step(1);
$("#shuf").onclick = () => {
  shuffle = !shuffle;
  $("#shuf").classList.toggle("act", shuffle);
  if (curId) buildQueue(curId);
};
$("#rep").onclick = () => {
  rep = (rep + 1) % 3;
  setIc($("#rep"), ["repeat", "repeat", "repeat1"][rep]);
  $("#rep").classList.toggle("act", rep > 0);
  audio.loop = rep === 2;
};
audio.onended = () => step(1, true); // 연속 재생
audio.addEventListener("play", () => { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
audio.addEventListener("pause", () => { if ("mediaSession" in navigator && !audio.ended) navigator.mediaSession.playbackState = "paused"; });
audio.addEventListener("loadedmetadata", () => {
  if (pendingSeek) { audio.currentTime = pendingSeek; pendingSeek = 0; }
  syncPos();
});
audio.addEventListener("seeked", syncPos);
if ("mediaSession" in navigator) {
  const m = navigator.mediaSession;
  m.setActionHandler("play", () => audio.play());
  m.setActionHandler("pause", () => audio.pause());
  m.setActionHandler("previoustrack", () => step(-1));
  m.setActionHandler("nexttrack", () => step(1));
  m.setActionHandler("seekto", (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
}

/* ---------- 업로드 ---------- */
const getDuration = (f) => new Promise((ok) => {
  const a = new Audio(), u = URL.createObjectURL(f);
  a.preload = "metadata";
  a.onloadedmetadata = () => { ok(a.duration); URL.revokeObjectURL(u); };
  a.onerror = () => ok(0);
  a.src = u;
});
const send = (f, ext, t, cb) => new Promise((ok, no) => {
  const x = new XMLHttpRequest();
  x.open("POST", "/api/upload?ext=" + ext);
  x.setRequestHeader("Authorization", "Bearer " + t);
  x.setRequestHeader("Content-Type", "application/octet-stream");
  x.upload.onprogress = (e) => e.lengthComputable && cb(Math.round((e.loaded / e.total) * 100));
  x.onload = () => {
    let d = {};
    try { d = JSON.parse(x.responseText); } catch {}
    if (x.status < 300) return ok(d);
    no(new Error(d.error === "quota" ? "용량 한도(" + LIMIT_GB + "GB)를 넘어요"
      : (d.error || "업로드 실패") + (d.detail ? " " + d.detail : "") + " (" + x.status + ")"));
  };
  x.onerror = () => no(new Error("네트워크 오류"));
  x.send(f);
});
/* ---------- wav → mp3 변환 (이 컴퓨터의 브라우저에서 처리) ---------- */
let lamePromise;
const loadLame = () => (lamePromise ||= new Promise((ok, no) => {
  if (window.lamejs) return ok();
  const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
  sc.onload = ok;
  sc.onerror = () => { lamePromise = null; no(new Error("변환 도구를 불러오지 못했어요 (인터넷 확인)")); };
  document.head.append(sc);
}));
async function wavToMp3(file, kbps, cb) {
  await loadLame();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  ctx.close();
  const ch = Math.min(2, buf.numberOfChannels);
  const enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, kbps);
  const L = buf.getChannelData(0), R = ch > 1 ? buf.getChannelData(1) : null;
  const to16 = (a, i, n) => {
    const o = new Int16Array(n);
    for (let k = 0; k < n; k++) { const v = Math.max(-1, Math.min(1, a[i + k])); o[k] = v < 0 ? v * 32768 : v * 32767; }
    return o;
  };
  const parts = [], step = 1152 * 20;
  for (let i = 0, c = 0; i < L.length; i += step, c++) {
    const n = Math.min(step, L.length - i);
    const out = ch > 1 ? enc.encodeBuffer(to16(L, i, n), to16(R, i, n)) : enc.encodeBuffer(to16(L, i, n));
    if (out.length) parts.push(out);
    if (c % 5 === 0) { cb(Math.round((i / L.length) * 100)); await new Promise((r) => setTimeout(r)); }
  }
  const end = enc.flush();
  if (end.length) parts.push(end);
  return new Blob(parts, { type: "audio/mpeg" });
}

async function up(f) {
  const row = document.createElement("div");
  row.textContent = f.name;
  $("#st").append(row);
  try {
    let ext = (f.name.split(".").pop() || "").toLowerCase();
    const dur = await getDuration(f);
    let file = f;
    if (ext === "wav" && $("#conv").checked) {
      file = await wavToMp3(f, Number($("#kbps").value), (p) => (row.textContent = f.name + " mp3로 변환 중 " + p + "%"));
      ext = "mp3";
    }
    if (file.size > 95 * 1048576) throw new Error("파일이 너무 커요 (약 95MB 이하만 가능)");
    const d = await send(file, ext, await token(), (p) => (row.textContent = f.name + " " + p + "%"));
    await sb("/rest/v1/tracks", {
      method: "POST",
      body: JSON.stringify({
        title: f.name.replace(/\.[^.]+$/, ""),
        duration_sec: Math.round(dur) || null,
        file_key: d.key, file_size: file.size, mime: d.contentType,
      }),
    });
    row.textContent = "✓ " + f.name;
  } catch (e) { row.textContent = "✗ " + f.name + " — " + e.message; }
}

/* ---------- 오프라인 저장 (이 기기의 IndexedDB) ---------- */
const idb = new Promise((ok, no) => {
  const r = indexedDB.open("mymusic", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("audio");
  r.onsuccess = () => ok(r.result);
  r.onerror = () => no(r.error);
});
async function store(mode, fn) {
  const db = await idb;
  return new Promise((ok, no) => {
    const t = db.transaction("audio", mode), q = fn(t.objectStore("audio"));
    t.oncomplete = () => ok(q && q.result);
    t.onerror = () => no(t.error);
  });
}
async function refreshSaved() {
  try { saved = new Set(await store("readonly", (x) => x.getAllKeys())); render(); } catch {}
}
async function saveTrack(t) {
  if (saved.has(t.file_key)) return;
  const r = await api("/api/audio?key=" + encodeURIComponent(t.file_key));
  if (!r.ok) throw new Error("다운로드 실패 (" + r.status + ")");
  const blob = await r.blob();
  await store("readwrite", (x) => x.put(blob, t.file_key));
  saved.add(t.file_key);
}
async function toggleSave(t) {
  try {
    if (saved.has(t.file_key)) {
      await store("readwrite", (x) => x.delete(t.file_key));
      saved.delete(t.file_key);
    } else {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      $("#msg").textContent = "저장 중… " + t.title;
      await saveTrack(t);
      $("#msg").textContent = "";

  } catch (e) { $("#msg").textContent = ""; alert("저장 실패: " + e.message); }
  render();
}
async function savePlaylist() {

  if (!todo.length) { alert("이미 모두 저장돼 있어요"); return; }
  const mb = Math.round(todo.reduce((n, t) => n + (t.file_size || 0), 0) / 1048576);
  if (!confirm(todo.length + "곡 (약 " + mb + "MB)을 이 기기에 저장할까요?")) return;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

    render();
  }

}

function applyPl() {
  if (plId && !plists.some((p) => p.id === plId)) plId = null;
  plItems = plId ? allPl.filter((r) => r.playlist_id === plId).map((r) => r.track_id) : [];
  const ul = $("#plList");
  ul.replaceChildren();
  $("#plEmpty0").textContent = plists.length ? "" : "아직 플레이리스트가 없어요. '＋ 새 목록'으로 만들어 보세요.";
  plists.forEach((p) => {
    const items = allPl.filter((r) => r.playlist_id === p.id);
    const first = tracks[byId(items[0] && items[0].track_id)] || {};
    const li = document.createElement("li");
    const tx = document.createElement("span");
    tx.className = "tx";
    const ti = document.createElement("span");
    ti.className = "ti";
    ti.textContent = p.name;
    tx.append(ti);
    const c = document.createElement("span");
    c.className = "dur";
    c.textContent = items.length + "곡";
    li.append(thumb(first), tx, c);
    li.onclick = () => { plId = p.id; applyPl(); };
    ul.append(li);
  });
  $("#plListView").classList.toggle("hide", !!plId);
  $("#plDetail").classList.toggle("hide", !plId);
  const cur = plists.find((p) => p.id === plId);
  $("#plName").textContent = cur ? cur.name : "";
  render();
}
function pick(title, items) {
  return new Promise((ok) => {
    const d = $("#dlg"), body = $("#dlgBody");
    let sel = -1;
    body.replaceChildren();
    const h = document.createElement("div");
    h.textContent = title;
    h.style.fontWeight = "600";
    body.append(h);
    items.forEach((name, i) => {
      const b = document.createElement("button");
      b.className = "mi";
      b.textContent = name;
      b.onclick = () => { sel = i; d.close(); };
      body.append(b);
    });
    d.onclose = () => ok(sel); // 창이 완전히 닫힌 뒤에 결과를 돌려줘야 다음 창과 겹치지 않음
    d.showModal();
  });
}
$("#dlgX").onclick = () => $("#dlg").close();

async function addTo(t) {
  if (!plists.length) { alert("먼저 위의 '＋ 새 목록'으로 플레이리스트를 만들어 주세요."); return; }
  const i = await pick("어느 플레이리스트에 담을까요?", plists.map((p) => p.name));
  if (i < 0) return;
  const pid = plists[i].id;
  const last = await sb("/rest/v1/playlist_tracks?playlist_id=eq." + pid + "&select=position&order=position.desc&limit=1");
  await sb("/rest/v1/playlist_tracks", {
    method: "POST",
    headers: { Prefer: "resolution=ignore-duplicates" },
    body: JSON.stringify({ playlist_id: pid, track_id: t.id, position: last.length ? last[0].position + 1 : 0 }),
  });
  await loadPlaylists();
  alert("'" + plists[i].name + "'에 담았어요");
}
async function removeFrom(t) {
  await sb("/rest/v1/playlist_tracks?playlist_id=eq." + plId + "&track_id=eq." + t.id, { method: "DELETE" });
  await loadPlaylists();
  render();
}
async function move(n, d) {
  const m = n + d;
  if (m < 0 || m >= plItems.length) return;
  [plItems[n], plItems[m]] = [plItems[m], plItems[n]];
  render();
  await sb("/rest/v1/playlist_tracks?on_conflict=playlist_id,track_id", {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify(plItems.map((id, i) => ({ playlist_id: plId, track_id: id, position: i }))),
  });
  await loadPlaylists();
}
function setScope(fav) { favView = fav; render(); saveResume(true); }
$("#sc-all").onclick = () => setScope(false);
$("#sc-fav").onclick = () => setScope(true);
$("#plBack").onclick = () => { plId = null; applyPl(); };
$("#plPlay").onclick = () => {
  const v = plTracks();
  if (!v.length) return;
  ctx = "pl";
  play(byId(v[0].id));
};
$("#plNew").onclick = async () => {
  const name = prompt("새 플레이리스트 이름");
  if (!name || !name.trim()) return;
  const r = await sb("/rest/v1/playlists", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify({ name: name.trim() }) });
  plId = r[0].id;
  await loadPlaylists();
  render();
};
$("#plRen").onclick = async () => {
  const p = plists.find((x) => x.id === plId);
  const name = p && prompt("새 이름", p.name);
  if (!name || !name.trim()) return;
  await sb("/rest/v1/playlists?id=eq." + plId, { method: "PATCH", body: JSON.stringify({ name: name.trim() }) });
  await loadPlaylists();
};
$("#plDel").onclick = async () => {
  const p = plists.find((x) => x.id === plId);
  if (!p || !confirm("플레이리스트 '" + p.name + "'을(를) 삭제할까요? (곡 파일은 지워지지 않아요)")) return;
  await sb("/rest/v1/playlists?id=eq." + plId, { method: "DELETE" });
  plId = null;
  await loadPlaylists();
  render();
};

/* ---------- 자켓 이미지 (가운데를 정사각형으로 잘라 600x600) ---------- */
function squareJpeg(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = 600;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 600, 600);
      URL.revokeObjectURL(u);
      c.toBlob((b) => (b ? ok(b) : no(new Error("이미지 변환 실패"))), "image/jpeg", 0.85);
    };
    img.onerror = () => no(new Error("이미지를 열 수 없어요"));
    img.src = u;
  });
}
$("#coverIn").onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  const t = coverTarget;
  if (!f || !t) return;
  try {
    const blob = await squareJpeg(f);
    const path = t.id + "-" + Date.now() + ".jpg";
    const tk = await token();
    const h = { apikey: CFG.key, Authorization: "Bearer " + tk };
    const r = await fetch(CFG.url + "/storage/v1/object/covers/" + path, { method: "POST", headers: { ...h, "Content-Type": "image/jpeg" }, body: blob });
    if (!r.ok) throw new Error(await r.text());
    await sb("/rest/v1/tracks?id=eq." + t.id, { method: "PATCH", body: JSON.stringify({ cover_path: path }) });
    if (t.cover_path) fetch(CFG.url + "/storage/v1/object/covers/" + t.cover_path, { method: "DELETE", headers: h }).catch(() => {});
    await load();
  } catch (err) { alert("자켓 설정 실패: " + err.message); }
};

/* ---------- 즐겨찾기 · 대기열 · 검색 · 이어 듣기 ---------- */
function cacheNow() { try { localStorage.setItem("cache", JSON.stringify({ tracks, plists, allPl })); } catch {} }
function syncFavBtn() {
  const t = tracks[byId(curId)], b = $("#favBtn");
  setIc(b, t && t.fav ? "heartF" : "heart");
  b.classList.toggle("act", !!(t && t.fav));
}
async function toggleFav(t) {
  const v = !t.fav;
  t.fav = v;
  render();
  try {
    await sb("/rest/v1/tracks?id=eq." + t.id, { method: "PATCH", body: JSON.stringify({ fav: v }) });
    cacheNow();
  } catch (e) { t.fav = !v; render(); alert("즐겨찾기를 바꾸지 못했어요: " + e.message); }
}
$("#favBtn").onclick = () => { const t = tracks[byId(curId)]; if (t) toggleFav(t); };

function saveQueue() { try { localStorage.setItem("rq", JSON.stringify({ queue, qpos })); } catch {} }
function enqueue(t, next) {
  if (curId == null || !queue.length) { play(byId(t.id)); return; }
  if (t.id === curId) return;
  const ix = queue.indexOf(t.id);
  if (ix >= 0) { queue.splice(ix, 1); if (ix < qpos) qpos--; }
  queue.splice(next ? qpos + 1 : queue.length, 0, t.id);
  saveQueue();
  prefetch();
  if (qOpen()) renderQueue();
  $("#msg").textContent = next ? "다음에 재생해요" : "대기열 끝에 추가했어요";
  setTimeout(() => { if ($("#msg").textContent.includes("대기열") || $("#msg").textContent.includes("다음에")) $("#msg").textContent = ""; }, 2000);
}
const qPanel = $("#qPanel");
const qOpen = () => !qPanel.classList.contains("hide");
function renderQueue() {
  qPanel.replaceChildren();
  const h = document.createElement("div");
  h.className = "h";
  h.textContent = "재생 대기열";
  qPanel.append(h);
  if (!queue.length) {
    const e = document.createElement("div");
    e.className = "mut";
    e.style.padding = "10px";
    e.textContent = "곡을 재생하면 순서가 여기에 보여요.";
    qPanel.append(e);
    return;
  }
  queue.slice(qpos, qpos + 100).forEach((id, k) => {
    const t = tracks[byId(id)];
    const d = document.createElement("div");
    d.className = "qi" + (k === 0 ? " on" : "");
    d.textContent = (k === 0 ? "▶ " : k + ". ") + (t ? t.title : "(삭제된 곡)");
    d.onclick = () => { if (k > 0) { qpos += k; play(byId(queue[qpos]), true); } };
    qPanel.append(d);
  });
  const more = queue.length - (qpos + 100);
  if (more > 0) {
    const e = document.createElement("div");
    e.className = "mut";
    e.style.padding = "10px";
    e.textContent = "… 외 " + more + "곡";
    qPanel.append(e);
  }
}
function toggleQueue(force) {
  const open = force === undefined ? !qOpen() : force;
  if (open) { renderQueue(); qPanel.style.bottom = $("#player").offsetHeight + 8 + "px"; qPanel.style.right = Math.max(12, innerWidth - $("#qBtn").getBoundingClientRect().right) + "px"; }
  qPanel.classList.toggle("hide", !open);
}
$("#qBtn").onclick = () => toggleQueue();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && qOpen()) toggleQueue(false); });
document.addEventListener("pointerdown", (e) => {
  if (qOpen() && !qPanel.contains(e.target) && !$("#qBtn").contains(e.target)) toggleQueue(false);
});

$("#q").oninput = () => { if (tab !== "lib") showTab("lib"); render(); };
$("#sort").onchange = () => { render(); saveResume(true); };

// 이어 듣기: 마지막 곡, 위치, 설정을 이 기기에 기억
function saveResume(force) {
  const now = Date.now();
  if (!force && now - lastSave < 4000) return;
  lastSave = now;
  if (!curId) return;
  try {
    localStorage.setItem("resume", JSON.stringify({
      curId, pos: pendingSeek || audio.currentTime || 0, shuffle, rep, plId, favView, sort: $("#sort").value,
    }));
  } catch {}
}
audio.addEventListener("timeupdate", () => saveResume());
audio.addEventListener("pause", () => saveResume(true));
document.addEventListener("visibilitychange", () => { if (document.hidden) saveResume(true); });

function ctlUi() {
  $("#shuf").classList.toggle("act", shuffle);
  setIc($("#rep"), ["repeat", "repeat", "repeat1"][rep]);
  $("#rep").classList.toggle("act", rep > 0);
}
async function restore() {
  let r, rq;
  try {
    r = JSON.parse(localStorage.getItem("resume") || "null");
    rq = JSON.parse(localStorage.getItem("rq") || "null");
  } catch { return; }
  if (!r) return;
  shuffle = !!r.shuffle;
  rep = r.rep || 0;
  audio.loop = rep === 2;
  ctlUi();
  if (r.sort) $("#sort").value = r.sort;
  favView = !!r.favView;
  render();
  const i = byId(r.curId);
  if (i < 0) return;
  await refreshSaved();
  curId = r.curId;
  const ids = rq && rq.queue ? rq.queue.filter((id) => byId(id) >= 0) : [];
  if (ids.includes(curId)) { queue = ids; qpos = ids.indexOf(curId); } else buildQueue(curId);
  const t = tracks[i];
  try {
    const src = await resolveSrc(t);
    curBlob = src.blob ? src.url : null;
    pendingSeek = r.pos || 0;
    audio.preload = "metadata";
    audio.src = src.url;
  } catch {}
  $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  const cu = coverUrl(t), pc = $("#pcov");
  pc.classList.toggle("hide", !cu);
  if (cu) pc.src = cu;
  announce(t);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  render();
  prefetch();
}

/* ---------- 곡 편집 탭 / 탭 전환 ---------- */
async function saveField(t, patch) {
  try {
    await sb("/rest/v1/tracks?id=eq." + t.id, { method: "PATCH", body: JSON.stringify(patch) });
    Object.assign(t, patch);
    cacheNow();
    $("#msg").textContent = "저장했어요";
    setTimeout(() => { if ($("#msg").textContent === "저장했어요") $("#msg").textContent = ""; }, 1500);
    render();
    if (t.id === curId) $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  } catch (e) { alert("저장하지 못했어요: " + e.message); }
}
function renderEdit() {
  const q = ($("#q2").value || "").trim().toLowerCase();
  const ul = $("#editList");
  ul.replaceChildren();
  tracks.filter((t) => !q || (t.title + " " + (t.artist || "")).toLowerCase().includes(q)).forEach((t) => {
    const li = document.createElement("li");
    li.className = "ed";
    const box = document.createElement("div");
    box.className = "edbox";
    const ti = document.createElement("input");
    ti.value = t.title;
    ti.placeholder = "제목";
    ti.onchange = () => {
      const v = ti.value.trim();
      if (!v) { ti.value = t.title; return; }
      if (v !== t.title) saveField(t, { title: v });
    };
    const ar = document.createElement("input");
    ar.value = t.artist || "";
    ar.placeholder = "아티스트";
    ar.onchange = () => {
      const v = ar.value.trim() || null;
      if (v !== (t.artist || null)) saveField(t, { artist: v });
    };
    box.append(ti, ar);
    li.append(thumb(t, () => { coverTarget = t; $("#coverIn").click(); }), box, btn("trash", () => del(t), "삭제"));
    ul.append(li);
  });
  if (!ul.children.length) { const e = document.createElement("li"); e.className = "ed mut"; e.textContent = "곡이 없어요."; ul.append(e); }
}
$("#q2").oninput = renderEdit;

function showTab(n) {
  tab = n;
  for (const k of ["lib", "edit", "add", "pl"]) {
    $("#tab-" + k).classList.toggle("hide", k !== n);
    $("#nv-" + k).classList.toggle("on", k === n);
  }
  if (n === "edit") renderEdit();
  window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => showTab(b.dataset.t)));

/* ---------- 재생바: 재생/일시정지, 진행 막대, 볼륨 ---------- */
const tfmt = (x) => (isFinite(x) && x > 0 ? Math.floor(x / 60) + ":" + String(Math.floor(x % 60)).padStart(2, "0") : "0:00");
const fill = (el) => el.style.setProperty("--p", (el.value / el.max) * 100 + "%");
let seeking = false;
const syncPP = () => setIc($("#pp"), audio.paused ? "play" : "pause");
$("#pp").onclick = () => { if (!audio.src) { const v = libView(); if (v.length) { ctx = "lib"; play(byId(v[0].id)); } return; } audio.paused ? audio.play() : audio.pause(); };
["play", "pause", "ended"].forEach((ev) => audio.addEventListener(ev, syncPP));
audio.addEventListener("timeupdate", () => {
  $("#tcur").textContent = tfmt(audio.currentTime);
  if (!seeking && audio.duration) { $("#seek").value = (audio.currentTime / audio.duration) * 1000; fill($("#seek")); }
});
["loadedmetadata", "durationchange"].forEach((ev) => audio.addEventListener(ev, () => { if (isFinite(audio.duration)) $("#tdur").textContent = tfmt(audio.duration); }));
$("#seek").oninput = () => { seeking = true; fill($("#seek")); if (audio.duration) $("#tcur").textContent = tfmt(($("#seek").value / 1000) * audio.duration); };
$("#seek").onchange = () => { if (audio.duration) audio.currentTime = ($("#seek").value / 1000) * audio.duration; seeking = false; };
const vol0 = Number(localStorage.getItem("vol") ?? 100);
$("#vol").value = vol0; audio.volume = vol0 / 100; fill($("#vol")); setIc($("#mute"), vol0 ? "vol" : "mute");
$("#vol").oninput = () => {
  const v = Number($("#vol").value);
  audio.volume = v / 100; audio.muted = false; fill($("#vol"));
  setIc($("#mute"), v ? "vol" : "mute");
  localStorage.setItem("vol", v);
};
$("#mute").onclick = () => { audio.muted = !audio.muted; setIc($("#mute"), audio.muted || !audio.volume ? "mute" : "vol"); };

$("#playAll").onclick = () => { const v = libView(); if (!v.length) return; ctx = "lib"; play(byId(v[0].id)); };
$("#shufAll").onclick = () => {
  const v = libView();
  if (!v.length) return;
  shuffle = true; ctlUi(); ctx = "lib";
  play(byId(v[Math.floor(Math.random() * v.length)].id));
};

/* 업로드 영역에 파일 끌어다 놓기 */
const drop = $("#drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", async (e) => { for (const f of e.dataTransfer.files) await up(f); await load(); });

/* ---------- 시작 ---------- */
function start() {
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#player").classList.remove("hide");
  $("#nav").classList.remove("hide");
  $("#searchBox").classList.remove("hide");
  $("#logout").classList.remove("hide");
  showTab("lib");
  refreshSaved();
  load().then(restore).catch((e) => ($("#empty").textContent = "목록을 불러오지 못했어요: " + e.message));
}
$("#lbtn").onclick = async () => {
  $("#lerr").textContent = "";
  try { await auth({ email: $("#em").value.trim(), password: $("#pw").value }, "password"); start(); }
  catch (e) { $("#lerr").textContent = e.message; }
};
$("#logout").onclick = logout;
window.addEventListener("online", () => { if (S) load().catch(() => {}); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  try {
    try {
      CFG = await (await fetch("/api/config")).json();
      localStorage.setItem("cfg", JSON.stringify(CFG));
    } catch { CFG = JSON.parse(localStorage.getItem("cfg") || "null"); }
    if (!CFG) throw new Error("no config");
    S = JSON.parse(localStorage.getItem("sess") || "null");
    if (S) start(); else $("#login").classList.remove("hide");
  } catch { $("#login").classList.remove("hide"); $("#lerr").textContent = "서버 설정을 불러오지 못했어요"; }
})();
</script>
