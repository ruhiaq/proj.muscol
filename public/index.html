<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musecoll</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musecoll">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f3f4f6;--acc:#2563eb;--line:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--fg:#eceff4;--mut:#9aa3b2;--card:#1b1f27;--acc:#6ea0ff;--line:#2a2f3a}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:200px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}
input,button{font:inherit;color:inherit}
input[type=email],input[type=password]{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:var(--card);color:var(--fg)}
.bar{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
.up{border:2px dashed var(--line);border-radius:12px;padding:14px;margin:12px 0}
.st div{font-size:14px;margin-top:6px;word-break:break-all}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
li.on{background:var(--card);font-weight:600}
li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#player .in{max-width:640px;margin:0 auto}
#now{font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#audio{width:100%;height:40px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ctl button{flex:1 1 0;padding:10px 6px}
.ctl #qBtn{flex:0 0 auto;padding:10px 14px}
#q{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.bar select#sort{flex:0 0 auto}
.ctl button.act{background:var(--acc);color:#fff}
li{align-items:center}
li .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th,.cov{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line);flex:none}
.th{display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;overflow:hidden}
.np{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.np #now{margin:0;min-width:0}
.bar select{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
dialog{max-height:80vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);min-width:260px;max-width:90vw}
dialog button{display:block;width:100%;margin:6px 0}
li .sm{background:none;color:var(--mut);padding:2px 6px;font-size:15px}
.err{color:#dc2626;font-size:14px;min-height:20px}
.hide{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1 1 0;min-width:0;white-space:nowrap;padding:8px 2px;font-size:12px;line-height:1.6;background:var(--card);color:var(--fg)}
.tabs button.on{background:var(--acc);color:#fff}
#msg{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:30;max-width:90vw;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px}
#msg:empty{display:none}
#qPanel{position:fixed;right:12px;z-index:20;width:min(360px,calc(100vw - 24px));max-height:55vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.35);padding:6px}
#qPanel .h{padding:8px 10px;font-weight:600}
#qPanel .qi{padding:10px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#qPanel .qi.on{background:var(--bg);font-weight:600}
li.ed{cursor:default;gap:10px}
.edbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.edbox input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
li.pl .tt{font-weight:600}
h2{font-size:17px;margin:4px 0 10px}
@media (min-width:900px){
  body{padding-bottom:110px}
  main{max-width:1300px;padding:24px 40px}
  #list,#editList,#plTracks,#plList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;align-content:start}
  #player .in{max-width:1300px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(280px,2fr) auto;align-items:center;gap:20px}
  #player .np{margin-bottom:0}
  #player .ctl{margin-top:0;flex-wrap:nowrap}
  .ctl button,.ctl #qBtn{flex:0 0 auto;padding:10px 16px}
  .tabs{max-width:640px}
}
@media (min-width:1500px){
  main,#player .in{max-width:1700px}
  #list,#editList,#plTracks,#plList{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>Musecoll</h1>
    <button class="ghost hide" id="logout">로그아웃</button>
  </header>

  <section id="login" class="hide">
    <input id="em" type="email" placeholder="이메일" autocomplete="username">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button id="lbtn">로그인</button>
  </section>

  <nav id="nav" class="tabs hide">
    <button id="nv-lib" data-t="lib" class="on">🎵<br>듣기</button>
    <button id="nv-edit" data-t="edit">✏️<br>곡 편집</button>
    <button id="nv-add" data-t="add">＋<br>곡 추가</button>
    <button id="nv-pl" data-t="pl">📃<br>플레이리스트</button>
  </nav>

  <section id="app" class="hide">
    <div id="tab-lib">
      <div class="bar">
        <input id="q" type="search" placeholder="곡 검색 (제목, 아티스트)">
      </div>
      <div class="bar">
        <select id="scope" class="grow" style="flex:1;min-width:0"><option value="">전체 곡</option><option value="fav">♥ 즐겨찾기</option></select>
        <select id="sort">
          <option value="new">최신순</option><option value="old">오래된순</option>
          <option value="title">이름순</option><option value="artist">아티스트순</option>
        </select>
      </div>
      <ul id="list"></ul>
      <p class="mut" id="empty"></p>
    </div>

    <div id="tab-edit" class="hide">
      <h2>곡 정보 수정</h2>
      <p class="mut">자켓 사진을 누르면 이미지를 바꿀 수 있어요. 제목·아티스트는 입력하고 칸 밖을 누르면 저장돼요.</p>
      <div class="bar"><input id="q2" type="search" placeholder="수정할 곡 검색"></div>
      <ul id="editList"></ul>
    </div>

    <div id="tab-add" class="hide">
      <h2>곡 추가</h2>
      <p class="mut" id="usage"></p>
      <div class="up">
      <label>곡 추가 (mp3, wav · 여러 개 선택 가능)<br>
        <input id="file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" multiple>
      </label>
      <div class="mut" style="margin-top:8px">
        <label><input type="checkbox" id="conv" checked> wav는 mp3로 변환해서 올리기 (용량 절약)</label>
        <select id="kbps"><option value="192" selected>192kbps</option><option value="256">256kbps</option><option value="320">320kbps</option></select>
      </div>
      <div class="st" id="st"></div>
    </div>
    </div>

    <div id="tab-pl" class="hide">
      <div id="plListView">
        <div class="bar"><h2 style="margin:0">플레이리스트</h2><button id="plNew">＋ 새 목록</button></div>
        <ul id="plList"></ul>
        <p class="mut" id="plEmpty0"></p>
      </div>
      <div id="plDetail" class="hide">
        <div class="bar"><button class="ghost" id="plBack">← 목록</button><h2 style="margin:0;flex:1" id="plName"></h2></div>
        <div class="bar">
          <button id="plPlay">▶ 재생</button>
          <button class="ghost" id="plSave">⬇ 저장</button>
          <button class="ghost" id="plRen">이름</button>
          <button class="ghost" id="plDel">삭제</button>
        </div>
        <ul id="plTracks"></ul>
        <p class="mut" id="plEmpty"></p>
      </div>
    </div>
  </section>
</main>

<div id="player" class="hide">
  <div class="in">
    <div class="np"><img id="pcov" class="cov hide" alt=""><div id="now">재생 중인 곡이 없어요</div></div>
    <audio id="audio" controls preload="none"></audio>
    <div class="ctl">
      <button class="ghost" id="prev" title="이전">⏮</button>
      <button class="ghost" id="next" title="다음">⏭</button>
      <button class="ghost" id="shuf" title="셔플">🔀</button>
      <button class="ghost" id="rep" title="반복">🔁</button>
      <button class="ghost" id="favBtn" title="즐겨찾기">♡</button>
      <button class="ghost" id="qBtn">☰ 대기열</button>
    </div>
  </div>
</div>

<p id="msg"></p>
<div id="qPanel" class="hide"></div>
<dialog id="dlg"><div id="dlgBody"></div><button class="ghost" id="dlgX">닫기</button></dialog>
<input id="coverIn" type="file" accept="image/*" class="hide">

<script>
const $ = (s) => document.querySelector(s);
const audio = $("#audio");
let CFG, S = null, tracks = [], curId = null, shuffle = false, rep = 0, queue = [], qpos = -1, plists = [], plId = null, plItems = [], coverTarget = null, allPl = [], saved = new Set(), curBlob = null, favView = false, pendingSeek = 0, lastSave = 0;
const LIMIT_GB = 9.5;

/* ---------- 로그인 / 토큰 ---------- */
async function auth(body, grant) {
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`, {
    method: "POST",
    headers: { apikey: CFG.key, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "로그인 실패");
  S = { access: d.access_token, refresh: d.refresh_token, exp: d.expires_at };
  localStorage.setItem("sess", JSON.stringify(S));
}
async function token() {
  if (S.exp - Date.now() / 1000 < 60) {
    try { await auth({ refresh_token: S.refresh }, "refresh_token"); }
    catch (e) { if (e instanceof TypeError) return S.access; logout(); throw new Error("다시 로그인해 주세요"); }
  }
  return S.access;
}
function logout() { localStorage.removeItem("sess"); location.reload(); }

// Supabase REST 호출
async function sb(path, opt = {}) {
  const t = await token();
  const r = await fetch(CFG.url + path, {
    ...opt,
    headers: { apikey: CFG.key, Authorization: "Bearer " + t, "Content-Type": "application/json", ...(opt.headers || {}) },
  });
  if (!r.ok) throw new Error(await r.text());
  const x = await r.text();
  return x ? JSON.parse(x) : null;
}
// 내 서버(/api/...) 호출
async function api(path, opt = {}) {
  const t = await token();
  return fetch(path, { ...opt, headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" } });
}

/* ---------- 곡 목록 ---------- */
const fmt = (s) => (s ? Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0") : "");

async function load() {
  try {
    tracks = await sb("/rest/v1/tracks?select=id,title,artist,duration_sec,file_key,file_size,cover_path,fav&order=created_at.desc&limit=1000");
    await loadPlaylists();
    cacheNow();
    const used = await sb("/rest/v1/rpc/used_bytes", { method: "POST", body: "{}" });
    $("#usage").textContent = (used / 1073741824).toFixed(2) + " / " + LIMIT_GB + " GB 사용";
  } catch (e) {
    const c = e instanceof TypeError && JSON.parse(localStorage.getItem("cache") || "null");
    if (!c) throw e;
    ({ tracks, plists, allPl } = c);
    applyPl();
    $("#usage").textContent = "오프라인 — 저장한 곡(⬇)만 재생돼요";
  }
  if (curId && view().some((t) => t.id === curId)) buildQueue(curId);
  render();
  if (tab === "edit") renderEdit();
}
const collator = new Intl.Collator("ko");
let ctx = "lib", tab = "lib"; // ctx: 지금 재생 중인 목록의 출처("lib" 듣기 / "pl" 플레이리스트)
const plTracks = () => plItems.map((id) => tracks[byId(id)]).filter(Boolean);
const libView = () => {
  let v = favView ? tracks.filter((t) => t.fav) : tracks;
  const q = ($("#q").value || "").trim().toLowerCase();
  if (q) v = v.filter((t) => (t.title + " " + (t.artist || "")).toLowerCase().includes(q));
  const m = $("#sort").value;
  if (m !== "new") {
    v = [...v];
    if (m === "old") v.reverse();
    else if (m === "title") v.sort((a, b) => collator.compare(a.title, b.title));
    else if (m === "artist") v.sort((a, b) => (a.artist ? 0 : 1) - (b.artist ? 0 : 1) || collator.compare(a.artist || "", b.artist || "") || collator.compare(a.title, b.title));
  }
  return v;
};
const view = () => (ctx === "pl" ? plTracks() : libView());
const coverUrl = (t) => (t.cover_path ? CFG.url + "/storage/v1/object/public/covers/" + t.cover_path : "");

function thumb(t, onclick) {
  const th = document.createElement(t.cover_path ? "img" : "div");
  th.className = "th";
  if (t.cover_path) th.src = coverUrl(t); else th.textContent = "♪";
  if (onclick) th.onclick = onclick; else th.style.cursor = "default";
  return th;
}
function rowsInto(ul, v, mode) {
  ul.replaceChildren();
  v.forEach((t, n) => {
    const li = document.createElement("li");
    if (t.id === curId) li.className = "on";
    const a = document.createElement("span");
    a.className = "tt";
    a.textContent = t.title + (t.artist ? " — " + t.artist : "");
    const b = document.createElement("span");
    b.className = "mut";
    b.textContent = (saved.has(t.file_key) ? "⬇ " : "") + fmt(t.duration_sec);
    li.append(thumb(t), a, b);
    if (mode === "pl") li.append(btn("▲", () => move(n, -1)), btn("▼", () => move(n, 1)));
    const hb = btn(t.fav ? "♥" : "♡", () => toggleFav(t));
    if (t.fav) hb.style.color = "#ef4444";
    li.append(hb, btn("⋯", () => menu(t, mode)));
    li.onclick = () => { ctx = mode; play(byId(t.id)); };
    ul.append(li);
  });
}
function render() {
  const v = libView();
  $("#empty").textContent = v.length ? ""
    : $("#q").value.trim() ? "검색 결과가 없어요."
    : favView ? "즐겨찾기한 곡이 없어요. 곡 옆의 ♡를 눌러 보세요."
    : "아직 곡이 없어요. '곡 추가' 탭에서 mp3나 wav를 추가해 보세요.";
  rowsInto($("#list"), v, "lib");
  const pv = plId ? plTracks() : [];
  rowsInto($("#plTracks"), pv, "pl");
  $("#plEmpty").textContent = plId && !pv.length ? "비어 있어요. '듣기' 탭에서 곡 옆의 ⋯ 메뉴로 담아 보세요." : "";
  syncFavBtn();
}
const btn = (label, fn) => {
  const b = document.createElement("button");
  b.className = "sm";
  b.textContent = label;
  b.onclick = (e) => { e.stopPropagation(); fn(); };
  return b;
};
async function edit(t) {
  const title = prompt("제목", t.title);
  if (title === null || !title.trim()) return;
  const artist = prompt("아티스트 (없으면 비워 두세요)", t.artist || "");
  if (artist === null) return;
  await sb("/rest/v1/tracks?id=eq." + t.id, {
    method: "PATCH",
    body: JSON.stringify({ title: title.trim(), artist: artist.trim() || null }),
  });
  await load();
}
async function del(t) {
  if (!confirm("'" + t.title + "' 곡을 삭제할까요? 되돌릴 수 없어요.")) return;
  const r = await api("/api/delete", { method: "POST", body: JSON.stringify({ id: t.id }) });
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    alert("삭제 실패: " + (d.error || r.status) + (d.detail ? " " + d.detail : ""));
    return;
  }
  if (saved.has(t.file_key)) {
    store("readwrite", (x) => x.delete(t.file_key)).catch(() => {});
    saved.delete(t.file_key);
  }
  if (t.cover_path) {
    const tk = await token();
    fetch(CFG.url + "/storage/v1/object/covers/" + t.cover_path, { method: "DELETE", headers: { apikey: CFG.key, Authorization: "Bearer " + tk } }).catch(() => {});
  }
  if (t.id === curId) {
    $("#pcov").classList.add("hide");
    audio.pause(); audio.removeAttribute("src"); audio.load();
    curId = null; queue = [];
    $("#now").textContent = "재생 중인 곡이 없어요";
  }
  await load();
}

/* ---------- 재생 ---------- */
const cache = {};
async function urlFor(key) {
  const c = cache[key];
  if (c && c.exp > Date.now()) return c.url;
  const r = await api("/api/play-url?key=" + encodeURIComponent(key));
  if (!r.ok) throw new Error("재생 주소를 받지 못했어요");
  const d = await r.json();
  cache[key] = { url: d.url, exp: Date.now() + (d.expiresIn - 300) * 1000 };
  return d.url;
}
const byId = (id) => tracks.findIndex((t) => t.id === id);
function buildQueue(startId) {
  let ids = view().map((t) => t.id);
  if (!ids.includes(startId)) ids = tracks.map((t) => t.id);
  if (shuffle) {
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    const k = ids.indexOf(startId);
    if (k > 0) { ids.splice(k, 1); ids.unshift(startId); }
  }
  queue = ids;
  qpos = Math.max(0, ids.indexOf(startId));
}
let pre = null; // 미리 준비해 둔 다음 곡 {id, url, blob}
async function resolveSrc(t) {
  if (pre && pre.id === t.id) { const p = pre; pre = null; return p; }
  if (saved.has(t.file_key)) {
    const blob = await store("readonly", (x) => x.get(t.file_key));
    if (blob) return { id: t.id, url: URL.createObjectURL(blob), blob: true };
  }
  if (!navigator.onLine) throw new Error("오프라인이라 저장된(⬇) 곡만 재생할 수 있어요");
  return { id: t.id, url: await urlFor(t.file_key), blob: false };
}
async function prefetch() {
  if (!queue.length) return;
  let p = qpos + 1;
  if (p >= queue.length) { if (rep !== 1) return; p = 0; }
  const t = tracks[byId(queue[p])];
  if (!t || (pre && pre.id === t.id)) return;
  try {
    const r = await resolveSrc(t);
    if (pre && pre.blob) URL.revokeObjectURL(pre.url);
    pre = r;
  } catch {}
}
function announce(t) {
  if (!("mediaSession" in navigator)) return;
  const cu = coverUrl(t);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: t.artist || "",
    artwork: cu ? [{ src: cu, sizes: "600x600", type: "image/jpeg" }] : [],
  });
  navigator.mediaSession.playbackState = "playing";
}
let playSeq = 0; // 가장 최근 재생 요청 번호 (겹친 요청의 오래된 오류를 무시하기 위함)
function syncPos() {
  try {
    if ("mediaSession" in navigator && isFinite(audio.duration))
      navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: audio.playbackRate });
  } catch {}
}
async function play(i, keep) {
  const t = tracks[i];
  if (!t) return;
  curId = t.id;
  if (!keep) buildQueue(t.id);
  pendingSeek = 0;
  saveQueue();
  const my = ++playSeq;
  announce(t); // 화면이 꺼져 있어도 반영되도록 가장 먼저 갱신
  try {
    const r = await resolveSrc(t);
    if (my !== playSeq) { if (r.blob) URL.revokeObjectURL(r.url); return; } // 더 새로운 요청이 있음
    const prev = curBlob;
    curBlob = r.blob ? r.url : null;
    audio.src = r.url;
    if (prev) URL.revokeObjectURL(prev);
    await audio.play();
  } catch (e) {
    if (my !== playSeq || e.name === "AbortError") return; // 다른 곡 요청에 밀려난 것일 뿐 진짜 실패가 아님
    $("#now").textContent = "재생 실패: " + e.message;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
    return;
  }
  if (my !== playSeq) return;
  $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  render();
  const cu = coverUrl(t), pc = $("#pcov");
  pc.classList.toggle("hide", !cu);
  if (cu) pc.src = cu;
  if (qOpen()) renderQueue();
  prefetch();
}
function step(d, auto) {
  if (!queue.length) return;
  if (!auto && d < 0 && audio.currentTime > 3) { audio.currentTime = 0; return; }
  let p = qpos + d;
  if (p >= queue.length) { if (auto && rep !== 1) { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; return; } p = 0; }
  if (p < 0) p = queue.length - 1;
  qpos = p;
  play(byId(queue[p]), true);
}
$("#prev").onclick = () => step(-1);

};
audio.onended = () => step(1, true); // 연속 재생
audio.addEventListener("play", () => { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
audio.addEventListener("pause", () => { if ("mediaSession" in navigator && !audio.ended) navigator.mediaSession.playbackState = "paused"; });
audio.addEventListener("loadedmetadata", () => {
  if (pendingSeek) { audio.currentTime = pendingSeek; pendingSeek = 0; }
  syncPos();
});
audio.addEventListener("seeked", syncPos);
if ("mediaSession" in navigator) {
  const m = navigator.mediaSession;
  m.setActionHandler("play", () => audio.play());
  m.setActionHandler("pause", () => audio.pause());
  m.setActionHandler("previoustrack", () => step(-1));
  m.setActionHandler("nexttrack", () => step(1));
  m.setActionHandler("seekto", (e) => { if (e.seekTime != null) audio.currentTime = e.seekTime; });
}

/* ---------- 업로드 ---------- */
const getDuration = (f) => new Promise((ok) => {
  const a = new Audio(), u = URL.createObjectURL(f);
  a.preload = "metadata";
  a.onloadedmetadata = () => { ok(a.duration); URL.revokeObjectURL(u); };
  a.onerror = () => ok(0);
  a.src = u;
});
const send = (f, ext, t, cb) => new Promise((ok, no) => {
  const x = new XMLHttpRequest();
  x.open("POST", "/api/upload?ext=" + ext);
  x.setRequestHeader("Authorization", "Bearer " + t);
  x.setRequestHeader("Content-Type", "application/octet-stream");
  x.upload.onprogress = (e) => e.lengthComputable && cb(Math.round((e.loaded / e.total) * 100));
  x.onload = () => {
    let d = {};
    try { d = JSON.parse(x.responseText); } catch {}
    if (x.status < 300) return ok(d);
    no(new Error(d.error === "quota" ? "용량 한도(" + LIMIT_GB + "GB)를 넘어요"
      : (d.error || "업로드 실패") + (d.detail ? " " + d.detail : "") + " (" + x.status + ")"));
  };
  x.onerror = () => no(new Error("네트워크 오류"));
  x.send(f);
});
/* ---------- wav → mp3 변환 (이 컴퓨터의 브라우저에서 처리) ---------- */
let lamePromise;
const loadLame = () => (lamePromise ||= new Promise((ok, no) => {
  if (window.lamejs) return ok();
  const sc = document.createElement("script");
  sc.src = "https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js";
  sc.onload = ok;
  sc.onerror = () => { lamePromise = null; no(new Error("변환 도구를 불러오지 못했어요 (인터넷 확인)")); };
  document.head.append(sc);
}));
async function wavToMp3(file, kbps, cb) {
  await loadLame();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  ctx.close();
  const ch = Math.min(2, buf.numberOfChannels);
  const enc = new lamejs.Mp3Encoder(ch, buf.sampleRate, kbps);
  const L = buf.getChannelData(0), R = ch > 1 ? buf.getChannelData(1) : null;
  const to16 = (a, i, n) => {
    const o = new Int16Array(n);
    for (let k = 0; k < n; k++) { const v = Math.max(-1, Math.min(1, a[i + k])); o[k] = v < 0 ? v * 32768 : v * 32767; }
    return o;
  };
  const parts = [], step = 1152 * 20;
  for (let i = 0, c = 0; i < L.length; i += step, c++) {
    const n = Math.min(step, L.length - i);
    const out = ch > 1 ? enc.encodeBuffer(to16(L, i, n), to16(R, i, n)) : enc.encodeBuffer(to16(L, i, n));
    if (out.length) parts.push(out);
    if (c % 5 === 0) { cb(Math.round((i / L.length) * 100)); await new Promise((r) => setTimeout(r)); }
  }
  const end = enc.flush();
  if (end.length) parts.push(end);
  return new Blob(parts, { type: "audio/mpeg" });
}

async function up(f) {
  const row = document.createElement("div");
  row.textContent = f.name;
  $("#st").append(row);
  try {
    let ext = (f.name.split(".").pop() || "").toLowerCase();
    const dur = await getDuration(f);
    let file = f;
    if (ext === "wav" && $("#conv").checked) {
      file = await wavToMp3(f, Number($("#kbps").value), (p) => (row.textContent = f.name + " mp3로 변환 중 " + p + "%"));
      ext = "mp3";
    }
    if (file.size > 95 * 1048576) throw new Error("파일이 너무 커요 (약 95MB 이하만 가능)");
    const d = await send(file, ext, await token(), (p) => (row.textContent = f.name + " " + p + "%"));
    await sb("/rest/v1/tracks", {

      }),
    });
    row.textContent = "✓ " + f.name;
  } catch (e) { row.textContent = "✗ " + f.name + " — " + e.message; }
}

/* ---------- 오프라인 저장 (이 기기의 IndexedDB) ---------- */
const idb = new Promise((ok, no) => {
  const r = indexedDB.open("mymusic", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("audio");
  r.onsuccess = () => ok(r.result);
  r.onerror = () => no(r.error);
});
async function store(mode, fn) {
  const db = await idb;
  return new Promise((ok, no) => {
    const t = db.transaction("audio", mode), q = fn(t.objectStore("audio"));
    t.oncomplete = () => ok(q && q.result);
    t.onerror = () => no(t.error);
  });
}
async function refreshSaved() {
  try { saved = new Set(await store("readonly", (x) => x.getAllKeys())); render(); } catch {}
}
async function saveTrack(t) {
  if (saved.has(t.file_key)) return;
  const r = await api("/api/audio?key=" + encodeURIComponent(t.file_key));
  if (!r.ok) throw new Error("다운로드 실패 (" + r.status + ")");
  const blob = await r.blob();
  await store("readwrite", (x) => x.put(blob, t.file_key));
  saved.add(t.file_key);
}
async function toggleSave(t) {
  try {
    if (saved.has(t.file_key)) {
      await store("readwrite", (x) => x.delete(t.file_key));

    } else {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      $("#msg").textContent = "저장 중… " + t.title;
      await saveTrack(t);

/* ---------- 자켓 이미지 (가운데를 정사각형으로 잘라 600x600) ---------- */
function squareJpeg(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = 600;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 600, 600);
      URL.revokeObjectURL(u);
      c.toBlob((b) => (b ? ok(b) : no(new Error("이미지 변환 실패"))), "image/jpeg", 0.85);
    };
    img.onerror = () => no(new Error("이미지를 열 수 없어요"));
    img.src = u;
  });
}

function enqueue(t, next) {
  if (curId == null || !queue.length) { play(byId(t.id)); return; }
  if (t.id === curId) return;
  const ix = queue.indexOf(t.id);
  if (ix >= 0) { queue.splice(ix, 1); if (ix < qpos) qpos--; }
  queue.splice(next ? qpos + 1 : queue.length, 0, t.id);
  saveQueue();
  prefetch();
  if (qOpen()) renderQueue();
  $("#msg").textContent = next ? "다음에 재생해요" : "대기열 끝에 추가했어요";
  setTimeout(() => { if ($("#msg").textContent.includes("대기열") || $("#msg").textContent.includes("다음에")) $("#msg").textContent = ""; }, 2000);
}

  $("#scope").value = favView ? "fav" : "";
  render();
  const i = byId(r.curId);
  if (i < 0) return;
  await refreshSaved();
  curId = r.curId;
  const ids = rq && rq.queue ? rq.queue.filter((id) => byId(id) >= 0) : [];
  if (ids.includes(curId)) { queue = ids; qpos = ids.indexOf(curId); } else buildQueue(curId);
  const t = tracks[i];
  try {
    const src = await resolveSrc(t);
    curBlob = src.blob ? src.url : null;
    pendingSeek = r.pos || 0;
    audio.preload = "metadata";
    audio.src = src.url;
  } catch {}
  $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  const cu = coverUrl(t), pc = $("#pcov");
  pc.classList.toggle("hide", !cu);
  if (cu) pc.src = cu;
  announce(t);
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  render();
  prefetch();
}

/* ---------- 곡 편집 탭 / 탭 전환 ---------- */
async function saveField(t, patch) {
  try {
    await sb("/rest/v1/tracks?id=eq." + t.id, { method: "PATCH", body: JSON.stringify(patch) });
    Object.assign(t, patch);
    cacheNow();
    $("#msg").textContent = "저장했어요";
    setTimeout(() => { if ($("#msg").textContent === "저장했어요") $("#msg").textContent = ""; }, 1500);
    render();
    if (t.id === curId) $("#now").textContent = t.title + (t.artist ? " — " + t.artist : "");
  } catch (e) { alert("저장하지 못했어요: " + e.message); }
}
function renderEdit() {
  const q = ($("#q2").value || "").trim().toLowerCase();
  const ul = $("#editList");
  ul.replaceChildren();
  tracks.filter((t) => !q || (t.title + " " + (t.artist || "")).toLowerCase().includes(q)).forEach((t) => {
    const li = document.createElement("li");
    li.className = "ed";
    const box = document.createElement("div");
    box.className = "edbox";
    const ti = document.createElement("input");
    ti.value = t.title;
    ti.placeholder = "제목";
    ti.onchange = () => {
      const v = ti.value.trim();
      if (!v) { ti.value = t.title; return; }
      if (v !== t.title) saveField(t, { title: v });
    };
    const ar = document.createElement("input");
    ar.value = t.artist || "";
    ar.placeholder = "아티스트";
    ar.onchange = () => {
      const v = ar.value.trim() || null;
      if (v !== (t.artist || null)) saveField(t, { artist: v });
    };
    box.append(ti, ar);
    li.append(thumb(t, () => { coverTarget = t; $("#coverIn").click(); }), box, btn("🗑", () => del(t)));
    ul.append(li);
  });
  if (!ul.children.length) { const e = document.createElement("li"); e.className = "ed mut"; e.textContent = "곡이 없어요."; ul.append(e); }
}
$("#q2").oninput = renderEdit;

function showTab(n) {
  tab = n;
  for (const k of ["lib", "edit", "add", "pl"]) {
    $("#tab-" + k).classList.toggle("hide", k !== n);
    $("#nv-" + k).classList.toggle("on", k === n);
  }
  if (n === "edit") renderEdit();
  window.scrollTo(0, 0);
}
document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => showTab(b.dataset.t)));

/* ---------- 시작 ---------- */
function start() {
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#player").classList.remove("hide");
  $("#nav").classList.remove("hide");
  $("#logout").classList.remove("hide");
  showTab("lib");
  refreshSaved();
  load().then(restore).catch((e) => ($("#empty").textContent = "목록을 불러오지 못했어요: " + e.message));
}
$("#lbtn").onclick = async () => {
  $("#lerr").textContent = "";
  try { await auth({ email: $("#em").value.trim(), password: $("#pw").value }, "password"); start(); }
  catch (e) { $("#lerr").textContent = e.message; }
};
$("#logout").onclick = logout;
window.addEventListener("online", () => { if (S) load().catch(() => {}); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async () => {
  try {
    try {
      CFG = await (await fetch("/api/config")).json();
      localStorage.setItem("cfg", JSON.stringify(CFG));
    } catch { CFG = JSON.parse(localStorage.getItem("cfg") || "null"); }
    if (!CFG) throw new Error("no config");
    S = JSON.parse(localStorage.getItem("sess") || "null");
    if (S) start(); else $("#login").classList.remove("hide");
  } catch { $("#login").classList.remove("hide"); $("#lerr").textContent = "서버 설정을 불러오지 못했어요"; }
})();
</script>
